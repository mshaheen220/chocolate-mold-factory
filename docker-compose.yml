# Production / single-container deployment.
# Builds the Vite frontend and Express backend into one image and serves
# both from port 3000.
#
#   docker compose up --build
#
# For a hot-reloading dual-service dev setup, layer the dev override:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  app:
    build:
      context: .
      target: runtime
    image: chocolate-mold-factory:latest
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - OPENSCAD_BIN=openscad
      - MAX_UPLOAD_BYTES=5242880
      - FILE_TTL_MS=3600000
    volumes:
      # Persist generated STL output across container restarts.
      - ./server/output:/app/server/output
      # Live-edit .scad templates without rebuilding the image.
      - ./server/templates:/app/server/templates
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
