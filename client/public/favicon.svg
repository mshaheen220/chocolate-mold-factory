<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background & Frame Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    
    <!-- Silicone Frame Gradients (Cyan / CAD vibe) -->
    <linearGradient id="frameTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="frameLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="frameRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Chocolate Cube Gradients -->
    <linearGradient id="chocoTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D4925"/>
      <stop offset="100%" stop-color="#6F3214"/>
    </linearGradient>
    <linearGradient id="chocoLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#54240C"/>
      <stop offset="100%" stop-color="#3C1805"/>
    </linearGradient>
    <linearGradient id="chocoRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3F1B07"/>
      <stop offset="100%" stop-color="#270F03"/>
    </linearGradient>

    <!-- Gold Accent / CAD Spark -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>

  <!-- App Icon Base -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Outer Mold Box (Isometric Base) -->
  <!-- Left Wall -->
  <polygon points="10,38 32,50 32,56 10,44" fill="url(#frameLeft)"/>
  <!-- Right Wall -->
  <polygon points="32,50 54,38 54,44 32,56" fill="url(#frameRight)"/>
  <!-- Top Rim of Mold -->
  <polygon points="10,38 32,26 54,38 32,50" fill="url(#frameTop)"/>
  
  <!-- Inner Mold Cavity (Shadowed Interior) -->
  <polygon points="14,38 32,28 50,38 32,48" fill="#082F49"/>

  <!-- Demolding Chocolate Block (Rising out of cavity) -->
  <!-- Left Face -->
  <polygon points="20,27 32,34 32,44 20,37" fill="url(#chocoLeft)"/>
  <!-- Right Face -->
  <polygon points="32,34 44,27 44,37 32,44" fill="url(#chocoRight)"/>
  <!-- Top Face -->
  <polygon points="20,27 32,20 44,27 32,34" fill="url(#chocoTop)"/>

  <!-- Chocolate Surface Specular Highlight / Temper Gloss -->
  <polygon points="23,26.5 32,21.5 41,26.5 32,29.5" fill="#A75D32" opacity="0.6"/>

  <!-- Registration Pin Indicator (Top Corner of Mold Rim) -->
  <circle cx="32" cy="46.5" r="1.5" fill="#38BDF8" opacity="0.9"/>
  <circle cx="15" cy="36.5" r="1.2" fill="#38BDF8" opacity="0.9"/>
  <circle cx="49" cy="36.5" r="1.2" fill="#0284C7" opacity="0.9"/>

  <!-- Precision CAD Crosshair Accent (Top Right) -->
  <path d="M49 12 L55 12 M52 9 L52 15" stroke="url(#goldSheen)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
